<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reality Engine — Admin</title>
<script src="/learning_engine.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; padding: 20px; direction: rtl; }
  h1 { color: #a371f7; margin-bottom: 20px; font-size: 22px; }
  .login { max-width: 320px; margin: 80px auto; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; }
  .login input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #e6edf3; font-size: 15px; margin: 12px 0; }
  .login button { width: 100%; padding: 10px; background: #a371f7; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .login .err { color: #f85149; font-size: 13px; margin-top: 8px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; text-align: center; }
  .stat-card .num { font-size: 28px; font-weight: 700; color: #a371f7; }
  .stat-card .lbl { font-size: 12px; color: #8b949e; margin-top: 4px; }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-bar button { padding: 6px 14px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #e6edf3; cursor: pointer; font-size: 13px; }
  .filter-bar button.active { background: #a371f7; border-color: #a371f7; }
  .pattern-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .pattern-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .badge.approved { background: #1a4731; color: #3fb950; }
  .badge.pending  { background: #2d1b00; color: #f0883e; }
  .metrics { display: flex; gap: 16px; font-size: 12px; color: #8b949e; margin-bottom: 8px; flex-wrap: wrap; }
  .metrics span b { color: #e6edf3; }
  .conf-bar { height: 4px; background: #30363d; border-radius: 2px; margin-bottom: 8px; }
  .conf-fill { height: 100%; border-radius: 2px; transition: width 0.3s; }
  .code-line { font-family: monospace; font-size: 12px; color: #8b949e; background: #0d1117; padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  .code-line .before { color: #f85149; }
  .code-line .after  { color: #3fb950; }
  .btn-danger { background: #f85149; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .actions { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .empty { text-align: center; color: #8b949e; padding: 40px; }
  .test-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 10px; font-family: monospace; font-size: 12px; }
  .test-pass { border-color: #3fb950; }
  .test-fail { border-color: #f85149; }
  @media print {
    .login, .filter-bar, .actions { display: none !important; }
    body { background: white !important; color: black !important; }
    .pattern-card { border: 1px solid #ccc !important; background: white !important; break-inside: avoid; }
  }
</style>
<script src="/learning_engine.js"></script>
</head>
<body>

<div class="login" id="loginBox">
  <h1>🔐 Admin Login</h1>
  <input type="password" id="passInput" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter')doLogin()">
  <button onclick="doLogin()">دخول</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="dashboard" style="display:none">
  <h1>🧠 Reality Engine — Admin</h1>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="actions">
    <button class="btn-secondary" onclick="loadDashboard()">🔄 تحديث</button>
    <button class="btn-secondary" onclick="exportPDF()">📄 Export PDF</button>
    <button class="btn-secondary" onclick="testLearnedFixes()">🧪 Test Learned</button>
    <button class="btn-danger" onclick="doReset()">🗑️ Reset Learning</button>
  </div>
  <div class="filter-bar">
    <button class="active" onclick="setFilter('all', this)">الكل</button>
    <button onclick="setFilter('approved', this)">✅ Approved</button>
    <button onclick="setFilter('pending', this)">⏳ Pending</button>
    <button onclick="setFilter('high', this)">🔥 High Conf</button>
  </div>
  <div id="testResults"></div>
  <div id="patterns"></div>
</div>

<script>
let currentFilter = 'all';

function doLogin() {
  const pass = document.getElementById('passInput').value;
  if (pass === 'naif2024') {
    sessionStorage.setItem('re_admin', '1');
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  } else {
    document.getElementById('loginErr').textContent = '❌ كلمة مرور خاطئة';
  }
}

if (sessionStorage.getItem('re_admin') === '1') {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function loadDashboard() {
  let db;
  try {
    const raw = localStorage.getItem('re_learned_patterns_v2');
    db = raw ? JSON.parse(raw) : { patterns: [], safe: [] };
  } catch(e) {
    db = { patterns: [], safe: [] };
  }
  const patterns = db.patterns || [];
  const safe = db.safe || [];
  const approved = patterns.filter(p => p.approved).length;
  const pending  = patterns.filter(p => !p.approved).length;
  const highConf = patterns.filter(p => p.confidence >= 0.7).length;
  const totalVer = patterns.reduce((s,p) => s + (p.verified||0), 0);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="num">${patterns.length}</div><div class="lbl">Patterns</div></div>
    <div class="stat-card"><div class="num" style="color:#3fb950">${approved}</div><div class="lbl">Approved</div></div>
    <div class="stat-card"><div class="num" style="color:#f0883e">${pending}</div><div class="lbl">Pending</div></div>
    <div class="stat-card"><div class="num" style="color:#58a6ff">${highConf}</div><div class="lbl">High Conf ≥0.7</div></div>
    <div class="stat-card"><div class="num" style="color:#3fb950">${totalVer}</div><div class="lbl">Total Verified</div></div>
    <div class="stat-card"><div class="num" style="color:#8b949e">${safe.length}</div><div class="lbl">Safe Patterns</div></div>
  `;
  renderPatterns(patterns);
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const raw = localStorage.getItem('re_learned_patterns_v2');
  if (!raw) return;
  renderPatterns(JSON.parse(raw).patterns || []);
}

function renderPatterns(patterns) {
  let list = patterns;
  if (currentFilter === 'approved') list = patterns.filter(p => p.approved);
  if (currentFilter === 'pending')  list = patterns.filter(p => !p.approved);
  if (currentFilter === 'high')     list = patterns.filter(p => p.confidence >= 0.7);
  if (!list.length) {
    document.getElementById('patterns').innerHTML = '<div class="empty">ما في patterns</div>';
    return;
  }
  list = [...list].sort((a,b) => (b.verified||0) - (a.verified||0));
  document.getElementById('patterns').innerHTML = list.map(p => {
    const conf = p.confidence || 0;
    const confPct = Math.round(conf * 100);
    const color = conf >= 0.7 ? '#3fb950' : conf >= 0.4 ? '#f0883e' : '#f85149';
    return `
    <div class="pattern-card">
      <div class="pattern-header">
        <span class="badge ${p.approved?'approved':'pending'}">${p.approved?'✅ Approved':'⏳ Pending'}</span>
        <b style="color:#a371f7">${p.type}</b>
        <span style="color:#8b949e;font-size:12px">sev: ${p.severity||'?'}</span>
      </div>
      <div class="metrics">
        <span>👁 Observed: <b>${p.observed||0}</b></span>
        <span>✅ Verified: <b style="color:#3fb950">${p.verified||0}</b></span>
        <span>❌ Failures: <b style="color:#f85149">${p.failures||0}</b></span>
        <span>📊 Confidence: <b style="color:${color}">${confPct}%</b></span>
      </div>
      <div class="conf-bar"><div class="conf-fill" style="width:${confPct}%;background:${color}"></div></div>
      <div class="code-line">
        <div class="before">← ${escHtml(p.before?.slice(0,80)||'')}</div>
        <div class="after">→ ${escHtml(p.after?.slice(0,80)||'')}</div>
      </div>
    </div>`;
  }).join('');
}

// ─── Test Learned Fixes (READ-ONLY) ─────────────────
function testLearnedFixes() {
  const resultsDiv = document.getElementById('testResults');

  // تحقق أن LearningEngine موجود
  if (typeof LearningEngine === 'undefined') {
    resultsDiv.innerHTML = '<div class="test-card test-fail">❌ LearningEngine غير محمّل في هذه الصفحة</div>';
    return;
  }

  // اقرأ patterns بدون تعديل
  let db;
  try {
    const raw = localStorage.getItem('re_learned_patterns_v2');
    db = raw ? JSON.parse(raw) : { patterns: [] };
  } catch(e) {
    resultsDiv.innerHTML = '<div class="test-card test-fail">❌ خطأ في قراءة patterns</div>';
    return;
  }

  const approved = (db.patterns||[]).filter(p => p.approved && p.before && p.after).slice(0, 5);
  if (!approved.length) {
    resultsDiv.innerHTML = '<div class="test-card">⚠️ ما في Approved patterns للاختبار</div>';
    return;
  }

  let passed = 0;
  const cards = approved.map((p, idx) => {
    // استدعاء applyLearned فقط — READ-ONLY
    const result = LearningEngine.applyLearned(p.before, 'test.js');
    const applied  = result.applied > 0;
    const actual   = applied ? result.fixed.trim() : '(not applied)';
    const expected = p.after.trim();
    const match    = applied && actual === expected;
    if (match) passed++;

    return `
    <div class="test-card ${match ? 'test-pass' : 'test-fail'}">
      <div style="color:#a371f7;font-weight:bold;margin-bottom:8px">#${idx+1} ${p.type} — ${match ? '✅ MATCH' : applied ? '❌ MISMATCH' : '⚠️ NOT APPLIED'}</div>
      <div style="color:#8b949e">before:   <span style="color:#e6edf3">${escHtml(p.before?.slice(0,70)||'')}</span></div>
      <div style="color:#8b949e">expected: <span style="color:#3fb950">${escHtml(expected?.slice(0,70)||'')}</span></div>
      <div style="color:#8b949e">actual:   <span style="color:${match?'#3fb950':'#f85149'}">${escHtml(actual?.slice(0,70)||'')}</span></div>
      <div style="margin-top:6px;color:#8b949e">applied: <b>${result.applied}</b></div>
    </div>`;
  }).join('');

  resultsDiv.innerHTML = `
    <div class="test-card" style="margin-bottom:10px">
      <b style="color:#a371f7">🧪 Test Learned Fixes — ${passed}/${approved.length} matched</b>
      <div style="color:#8b949e;font-size:11px;margin-top:4px">READ-ONLY: لا تعديل على patterns أو localStorage</div>
    </div>
    ${cards}`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportPDF() {
  const title = document.title;
  document.title = 'Reality Engine - Learning Patterns';
  window.print();
  document.title = title;
}

function doReset() {
  if (!confirm('حذف كل الـ patterns؟ لا يمكن التراجع.')) return;
  const pass = prompt('أكد كلمة المرور:');
  if (pass !== 'naif2024') { alert('❌ خاطئة'); return; }
  localStorage.removeItem('re_learned_patterns_v2');
  loadDashboard();
}

if (sessionStorage.getItem('re_admin') === '1') loadDashboard();
</script>
</body>
</html>
