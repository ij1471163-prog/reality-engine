<script>
"use strict";

// ═══════════════════════════════════════════════════════
// State
// ═══════════════════════════════════════════════════════

const F = {}; // filename → content
window._sessionToken = null;

// جيب session عند تحميل الصفحة
fetch('/api/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'})
  .then(r => r.json())
  .then(d => { if (d.token) window._sessionToken = d.token; })
  .catch(() => {});
// Debug - show on page
setTimeout(() => {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;bottom:60px;left:8px;right:8px;background:#161b22;color:#e6edf3;padding:8px;border-radius:8px;font-size:11px;z-index:9999;font-family:monospace';
  d.textContent = 'analyzeJava: ' + typeof analyzeJava + ' | analyzeCode: ' + typeof analyzeCode;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 5000);
}, 1000);
const R = {}; // filename → { code, issues }
let _toastTimer = null;

// ═══════════════════════════════════════════════════════
// Init
// ═══════════════════════════════════════════════════════

if (typeof loadAcorn !== 'undefined') {
    loadAcorn(() => { /* AST engine ready */ });
}

// Drag & drop
const dz = document.getElementById('dz');
dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {
    e.preventDefault(); dz.classList.remove('drag');
    loadFiles(e.dataTransfer.files);
});
document.getElementById('inp').addEventListener('change', e => loadFiles(e.target.files));
document.getElementById('inp-zip').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    toast('⏳ جاري فك الضغط...');
    const form = new FormData();
    const ALLOWED = ['.py','.js','.ts','.java','.html','.jsx','.tsx','.kt','.php'];
    try {
        const zip = await JSZip.loadAsync(file);
        const promises = [];
        let count = 0;
        zip.forEach((path, entry) => {
            if (entry.dir || count >= 20) return;
            const ext = '.' + path.split('.').pop().toLowerCase();
            if (!ALLOWED.includes(ext)) return;
            count++;
            const name = path.split('/').pop();
            promises.push(entry.async('string').then(c => { F[name] = c; }));
        });
        await Promise.all(promises);
        _fromZip = true;
        document.getElementById('btn-fixall').style.display = 'inline-block';
        document.getElementById('btn-aiall').style.display = 'inline-block';
        renderFiles();
        toast('✅ ' + count + ' ملف من ZIP');
    } catch(err) {
        toast('❌ ' + err.message, 'e');
    }
    e.target.value = '';
});

// ═══════════════════════════════════════════════════════
// File Loading
// ═══════════════════════════════════════════════════════

function loadFiles(fl) {
    _fromZip = false;
    for (const f of fl) {
        if (Object.keys(F).length >= 10) { toast('الحد 10 ملفات', 'e'); break; }
        if (f.size > 512000)              { toast(f.name + ': يتجاوز 500KB', 'e'); continue; }
        const r = new FileReader();
        r.onload = e => { F[f.name] = e.target.result; renderFiles(); };
        r.readAsText(f);
    }
}

function renderFiles() {
    const ns = Object.keys(F);
    document.getElementById('fs').style.display = ns.length ? 'block' : 'none';
    document.getElementById('fc-count').textContent = ns.length + ' ملف';
    document.getElementById('fg').innerHTML = ns.map(n => `
        <div class="fc">
          <button class="rm" onclick="delFile(${JSON.stringify(n)})">×</button>
          <div class="ic">${fileIcon(n)}</div>
          <div class="nm">${esc(n)}</div>
          <div class="mt">${fileSize(new Blob([F[n]]).size)}</div>
        </div>`).join('');
}

function delFile(n) { delete F[n]; renderFiles(); }
function clearAll() { Object.keys(F).forEach(k => delete F[k]); renderFiles(); }
function goBack() {
    document.getElementById('s-res').style.display    = 'none';
    document.getElementById('s-upload').style.display = 'block';
}

// ═══════════════════════════════════════════════════════
// Analyze
// ═══════════════════════════════════════════════════════

function analyzeAll() {
  // تحقق من session
  if (!window._sessionToken) {
    toast('⚠️ جلسة منتهية — أعد فتح التطبيق', 'e');
    return;
  }
    Object.keys(R).forEach(k => delete R[k]);
    let tot = 0, st = 0, bg = 0;
    Object.entries(F).forEach(([n, c]) => {
        const iss = analyzeCode(c, n); // من engine.js — لا تكرار هنا
        R[n] = { code: c, issues: iss };
        tot += iss.length;
        st  += iss.filter(i => i.type === 'stub').length;
        bg  += iss.filter(i => i.type === 'bug').length;
    });
    renderResults(tot, st, bg);
}

// ═══════════════════════════════════════════════════════
// Render Results
// ═══════════════════════════════════════════════════════

function renderResults(tot, st, bg) {
    document.getElementById('s-upload').style.display = 'none';
    document.getElementById('s-res').style.display    = 'block';
    const fc = Object.keys(F).length;

    document.getElementById('sum').innerHTML = `
        <div class="st"><div class="sn">${fc}</div><div class="sl">ملف</div></div>
        <div class="st"><div class="sn" style="color:${tot ? '#f85149' : '#3fb950'}">${tot}</div><div class="sl">مشكلة</div></div>
        <div class="st"><div class="sn">${st}</div><div class="sl">دوال ناقصة</div></div>
        <div class="st"><div class="sn">${bg}</div><div class="sl">أخطاء</div></div>`;
    document.getElementById('ri').textContent = tot + ' مشكلة في ' + fc + ' ملف';
    document.getElementById('btn-dl').style.display      = 'inline-block';
    document.getElementById('btn-fixall').style.display  = 'inline-block';

    const il = document.getElementById('il');

    // Typo warnings
    let typoHtml = '';
    if (typeof detectDangerousTypos !== 'undefined') {
        Object.entries(F).forEach(([fn, code]) => {
            const typos = detectDangerousTypos(code);
            if (typos.length && typeof renderTypoWarnings !== 'undefined')
                typoHtml += renderTypoWarnings(typos);
        });
    }

    if (!tot) {
        il.innerHTML = typoHtml
            ? typoHtml + '<div class="empty" style="margin-top:12px">✅ لا مشاكل منطقية</div>'
            : '<div class="empty">✅ لا مشاكل في هذا المشروع</div>';
        return;
    }

    let h = '';
    let idx = 0;
    Object.entries(R).forEach(([fn, { issues }]) => {
        issues.forEach(iss => {
            const sc  = { c:'bc', h:'bh', m:'bm', stub:'bs' }[iss.type === 'stub' ? 'stub' : iss.sev] || 'bm';
            const sl  = { c:'حرج', h:'عالي', m:'متوسط' }[iss.sev] || '';
            const cc  = iss.conf >= 90 ? '#3fb950' : iss.conf >= 60 ? '#d29922' : '#f85149';
            const canA   = iss.fix && iss.conf >= 90;
            const needR  = iss.fix && iss.conf >= 60 && iss.conf < 90;
            const fnJ    = JSON.stringify(fn);
            const evJ    = JSON.stringify(iss.ev);
            const fixJ   = JSON.stringify(iss.fix);
            const titleJ = JSON.stringify(iss.title);
            h += `<div class="issue" id="i${idx}">
              <div class="it">
                <span class="badge ${sc}">${sl}</span>
                <div class="itl">${esc(iss.title)}</div>
                <div class="iloc">${esc(fn)} — س${iss.line}</div>
                <span style="color:${cc};font-size:12px;font-weight:700;cursor:help"
                      title="${esc((iss.cEv || []).join('\n'))}">${iss.cIcon} ${iss.conf}% — ${esc(iss.cAct)}</span>
              </div>
              <div class="code">${esc(iss.ev)}</div>
              ${iss.fix ? `<div class="code code-fix">✅ ${esc(iss.fix)}</div>` : ''}
              <div class="ia">
                ${canA  ? `<button class="btn btn-ok btn-sm" onclick="applyFix(${fnJ},${iss.line - 1},${evJ},${fixJ},${idx})">🟢 تطبيق آمن</button>` : ''}
                ${needR ? `<button class="btn btn-s  btn-sm" onclick="applyFix(${fnJ},${iss.line - 1},${evJ},${fixJ},${idx})">🟡 تطبيق مع مراجعة</button>` : ''}
                <button class="btn btn-s btn-sm" onclick="askAI(${fnJ},${evJ},${titleJ},this)">🤖 AI</button>
              </div>
            </div>`;
            idx++;
        });
    });
    il.innerHTML = (typoHtml || '') + h;
}

// ═══════════════════════════════════════════════════════
// Apply Fix — من الأسفل للأعلى (no index drift)
// ═══════════════════════════════════════════════════════

function applyFix(fn, li, oldLine, newLine, idx) {
    const lines = F[fn].split('\n');
    if (li < 0 || li >= lines.length) return;
    const ind = lines[li].match(/^(\s*)/)[1];

    // ابحث عن def وحذف الجسم (من الأسفل)
    let defLine = li;
    for (let i = li; i >= Math.max(0, li - 3); i--) {
        if (/^def\s+/.test(lines[i].trim())) { defLine = i; break; }
    }
    let endLine = defLine + 1;
    while (endLine < lines.length
        && (lines[endLine].trim() === ''
            || lines[endLine].trim() === 'pass'
            || lines[endLine].trim().startsWith('#'))) endLine++;

    const fixLines = newLine.split('\n').map(l => ind + l.trimStart());
    // ✅ splice يعمل صح لأننا نعالج issue واحدة في كل مرة
    lines.splice(defLine, endLine - defLine, lines[defLine], ...fixLines);
    F[fn] = lines.join('\n');

    const newIss = analyzeCode(F[fn], fn);
    const gone   = !newIss.some(ni =>
        ni.title === R[fn].issues.find(oi => oi.line === li + 1)?.title
        && Math.abs(ni.line - (li + 1)) <= 2
    );
    R[fn] = { code: F[fn], issues: newIss };
    toast(gone ? '✅ تم التحقق — المشكلة اختفت' : '⚠️ تم التطبيق — راجع النتيجة', gone ? 's' : 'w');
    refreshStats();
}

// ═══════════════════════════════════════════════════════
// Ask AI — btn مُمرَّر كـ param (لا event.target في async)
// ═══════════════════════════════════════════════════════

async function askAI(fn, ev, title, btn) {
    // ✅ حفظ المرجع قبل أي await
    btn.innerHTML = '⏳'; btn.disabled = true;
    try {
        const token = await getToken();
        const pr = `أكمل هذه الدالة الناقصة بكود صحيح فقط بدون شرح:
الملف: ${fn}
البيانات المتاحة:
${Object.values(F)[0]?.slice(0, 500) || ''}
الدالة:
${ev}

أرجع فقط:
AFTER:
\`\`\`
الكود المكتمل
\`\`\``;
        const result = await chatAPI(token, pr);
        const after  = result.match(/```(?:python|js)?\n([\s\S]*?)```/)?.[1]?.trim() || result;
        if (confirm('🤖 AI اقترح:\n\n' + after.slice(0, 200) + (after.length > 200 ? '\n...' : '') + '\n\nهل تطبق الإصلاح؟')) {
            applyAIResult(fn, ev, after);
        }
    } catch (e) {
        alert('❌ ' + e.message);
    } finally {
        btn.innerHTML = '🤖 AI'; btn.disabled = false;
    }
}

// ═══════════════════════════════════════════════════════
// Fix All with AI
// ═══════════════════════════════════════════════════════

async function fixAllWithAI() {
    // فحص typos أولاً
    if (typeof detectDangerousTypos !== 'undefined') {
        const hasRisk = Object.values(F).some(code => detectDangerousTypos(code).length > 0);
        if (hasRisk && !confirm('⚠️ الكود يحتوي APIs خطرة. متابعة للاختبار؟')) { return; }
    }

    const btn = document.getElementById('btn-aiall');
    btn.innerHTML = '⏳ جاري...'; btn.disabled = true;

    try {
        const token = await getToken();
        // ✅ انتظر كل ملف بشكل متسلسل — مو داخل forEach
        for (const fn of Object.keys(F)) {
            if (!R[fn]?.issues?.length) continue;
            const prompt = `أنت مبرمج خبير. أصلح هذا الكود — أكمل الدوال الناقصة وصلح الأخطاء المنطقية.
أرجع الكود الكامل المصلح فقط بدون شرح بين \`\`\` و \`\`\`.

الكود:
\`\`\`
${F[fn]}
\`\`\``;
            const result = await chatAPI(token, prompt);
            const fixed  = result.match(/```(?:\w+)?\n([\s\S]*?)```/)?.[1]?.trim();
            if (!fixed) continue;

            await new Promise(resolve => showDiff(fn, F[fn], fixed, () => {
                F[fn] = fixed;
                R[fn] = { code: fixed, issues: analyzeCode(fixed, fn) };
                resolve();
            }, resolve)); // ✅ resolve يُمرَّر للرفض أيضاً
        }
        refreshStats();
        document.getElementById('btn-dl').style.display = 'inline-block';
        toast('✅ تم إصلاح المشروع بـ AI');
    } catch (e) {
        toast('❌ ' + e.message, 'e');
    } finally {
        btn.innerHTML = '🤖 إصلاح الكل بـ AI'; btn.disabled = false;
    }
}

// ═══════════════════════════════════════════════════════
// Fix All Engine — من الأسفل للأعلى لكل ملف
// ═══════════════════════════════════════════════════════

function fixAllEngine() {
    // فحص typos خطرة
    if (typeof detectDangerousTypos !== 'undefined') {
        const hasRisk = Object.values(F).some(code => detectDangerousTypos(code).length > 0);
        if (hasRisk && !confirm('⚠️ الكود يحتوي APIs خطرة. متابعة للاختبار؟')) { return; }
    }
    let fixed = 0;
    Object.keys(R).forEach(fn => {
        const issues = (typeof analyzeCodeEnhanced !== "undefined" ? analyzeCodeEnhanced : analyzeCode)(F[fn], fn);
        const lines  = F[fn].split('\n');
        // ✅ من الأسفل للأعلى — no index drift
        issues.slice().reverse().forEach(issue => {
            if (!issue.fix) return;
            const li = issue.line - 1;
            if (li < 0 || li >= lines.length) return;
            if (issue.title.includes('forEach')) {
                for (let i = li; i >= Math.max(0, li - 5); i--) {
                    if (lines[i].includes('.forEach(')) {
                        const ind = lines[i].match(/^(\s*)/)[1];
                        lines[i] = ind + issue.fix.trimStart();
                        fixed++; break;
                    }
                }
            } else {
                const ind = lines[li].match(/^(\s*)/)[1];
                lines[li] = ind + issue.fix.trimStart();
                fixed++;
            }
        });
        F[fn] = lines.join('\n');
        R[fn] = { code: F[fn], issues: analyzeCode(F[fn], fn) };
    });
    toast('✅ تم إصلاح ' + fixed + ' مشكلة');
    refreshStats();
    document.getElementById('btn-dl').style.display = 'inline-block';
    if (fixed > 0) setTimeout(() => { if (_fromZip) dlAsZip(); else dlAll(); }, 300);
}

// ═══════════════════════════════════════════════════════
// Diff Dialog — زر واحد / onApprove واحد
// ═══════════════════════════════════════════════════════

function showDiff(fn, original, fixed, onApprove, onReject) {
    const diff   = calcDiff(original, fixed);
    const risk   = diff.total <= 2 ? '🟢 آمن' : diff.total <= 8 ? '🟡 راجع' : '🔴 تجاوز نطاق';
    const d      = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#000a;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';

    // ✅ لا innerHTML لأزرار — ننشئ الأزرار كـ elements مباشرة
    const box = document.createElement('div');
    box.style.cssText = 'background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;max-width:500px;width:100%';
    box.innerHTML = `
        <div style="color:#a371f7;font-weight:700;font-size:16px;margin-bottom:16px">📊 تحليل التغييرات</div>
        <div style="background:#010409;border-radius:8px;padding:12px;margin-bottom:12px">
          <div style="color:#e6edf3;margin-bottom:6px">📄 ${esc(fn)}</div>
          <div style="color:#3fb950">✅ معدّل: ${diff.changed}</div>
          <div style="color:#58a6ff">➕ مضاف: ${diff.added}</div>
          <div style="color:#f85149">➖ محذوف: ${diff.removed}</div>
          <div style="margin-top:8px;font-weight:700;font-size:15px">${risk}</div>
        </div>
        ${diff.total > 5 ? '<div style="color:#d29922;font-size:13px;margin-bottom:12px">⚠️ AI غيّر أكثر من المطلوب</div>' : ''}`;

    const btnRow = document.createElement('div');
    btnRow.style.cssText = 'display:flex;gap:8px';

    const btnReject = document.createElement('button');
    btnReject.style.cssText = 'flex:1;padding:10px;background:#b91c1c;color:#fff;border:none;border-radius:8px;cursor:pointer';
    btnReject.textContent = '❌ رفض';
    btnReject.onclick = () => { d.remove(); if (onReject) onReject(); };

    const btnAccept = document.createElement('button');
    btnAccept.style.cssText = 'flex:1;padding:10px;background:#238636;color:#fff;border:none;border-radius:8px;cursor:pointer';
    btnAccept.textContent = '✅ قبول';
    btnAccept.onclick = () => { d.remove(); onApprove(); };

    btnRow.appendChild(btnReject);
    btnRow.appendChild(btnAccept);
    box.appendChild(btnRow);
    d.appendChild(box);
    document.body.appendChild(d);
}

function calcDiff(original, fixed) {
    const oL = original.split('\n'), fL = fixed.split('\n');
    let changed = 0, added = 0, removed = 0;
    const max = Math.max(oL.length, fL.length);
    for (let i = 0; i < max; i++) {
        if (oL[i] === undefined) added++;
        else if (fL[i] === undefined) removed++;
        else if (oL[i] !== fL[i]) changed++;
    }
    return { changed, added, removed, total: changed + added + removed };
}

// هل المشروع جاء من ZIP؟
let _fromZip = false;

function dlAll() {
    if (_fromZip) { dlAsZip(); return; }
    const entries = Object.entries(F);
    if (!entries.length) return;
    let idx = 0;

    function showNext() {
        if (idx >= entries.length) return;
        const [n, c] = entries[idx++];
        const d = document.createElement('div');
        d.style.cssText = 'position:fixed;inset:0;background:#000d;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
        const safe = c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        d.innerHTML = `
            <div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;max-width:560px;width:100%;max-height:90vh;display:flex;flex-direction:column">
              <div style="color:#a371f7;font-weight:700;margin-bottom:12px;font-size:15px">📄 ${esc(n)}</div>
              <textarea style="flex:1;min-height:200px;max-height:50vh;background:#010409;color:#e6edf3;border:1px solid #30363d;border-radius:8px;padding:10px;font-family:monospace;font-size:11px;direction:ltr;resize:none;margin-bottom:12px" readonly>${safe}</textarea>
              <div style="display:flex;gap:8px">
                <button id="_dl" style="flex:1;padding:12px;background:#238636;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">⬇️ تنزيل</button>
                <button id="_cp" style="flex:1;padding:12px;background:#21262d;color:#58a6ff;border:1px solid #30363d;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">📋 نسخ</button>
                <button id="_nx" style="padding:12px 16px;background:#21262d;color:#8b949e;border:1px solid #30363d;border-radius:8px;cursor:pointer;font-size:14px">${idx < entries.length ? '→ التالي' : '✕ إغلاق'}</button>
              </div>
            </div>`;
        document.body.appendChild(d);

        d.querySelector('#_dl').onclick = () => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([c], { type: 'text/plain' }));
            a.download = n; document.body.appendChild(a); a.click();
            setTimeout(() => document.body.removeChild(a), 1000);
            toast('✅ تم التنزيل');
        };
        d.querySelector('#_cp').onclick = function () {
            navigator.clipboard.writeText(c).then(() => {
                this.textContent = '✅ تم النسخ';
                setTimeout(() => this.textContent = '📋 نسخ', 2000);
            }).catch(() => {
                d.querySelector('textarea').select();
                document.execCommand('copy');
                this.textContent = '✅ تم النسخ';
                setTimeout(() => this.textContent = '📋 نسخ', 2000);
            });
        };
        d.querySelector('#_nx').onclick = () => { d.remove(); showNext(); };
    }
    showNext();
}

// API Helpers

async function getToken() {
    const sr = await fetch('/api/session', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
    if (!sr.ok) throw new Error('تجاوزت الحد — انتظر ساعة');
    const { token } = await sr.json();
    return token;
}

async function chatAPI(token, prompt) {
    const cr = await fetch('/api/chat', {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + token },
        body: JSON.stringify({ prompt })
    });
    if (!cr.ok) throw new Error('خطأ في AI');
    const { result } = await cr.json();
    return result;
}

function applyAIResult(fn, ev, after) {
    const lines = F[fn].split('\n');
    const funcBase = ev.split('(')[0].trim();
    let start = -1;
    lines.forEach((l, i) => { if (l.includes(funcBase)) start = i; });
    if (start < 0) return;
    let end = start + 1;
    while (end < lines.length
        && (lines[end].startsWith(' ') || lines[end].startsWith('\t') || lines[end].trim() === ''))
        end++;
    lines.splice(start, end - start, ...after.split('\n'));
    F[fn] = lines.join('\n');
    R[fn] = { code: F[fn], issues: analyzeCode(F[fn], fn) };
    refreshStats();
    toast('✅ تم تطبيق إصلاح AI');
}

// ═══════════════════════════════════════════════════════
// Stats refresh بدون إعادة render كاملة
// ═══════════════════════════════════════════════════════

function refreshStats() {
    let tot = 0, st = 0, bg = 0;
    Object.values(R).forEach(r => {
        tot += r.issues.length;
        st  += r.issues.filter(i => i.type === 'stub').length;
        bg  += r.issues.filter(i => i.type === 'bug').length;
    });
    renderResults(tot, st, bg);
}

// ═══════════════════════════════════════════════════════
// Utilities
// ═══════════════════════════════════════════════════════

async function dlAsZip() {
    const zip = new JSZip();
    Object.entries(F).forEach(([name, content]) => {
        zip.file(name, content);
    });
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reality-engine-fixed.zip';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => document.body.removeChild(a), 1000);
    toast('✅ تم تنزيل ZIP');
}

function esc(s) {
    return String(s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fileIcon(n) {
    if (n.endsWith('.py'))              return '🐍';
    if (/\.(js|ts|jsx)$/.test(n))      return '📜';
    if (n.endsWith('.java'))            return '☕';
    if (n.endsWith('.html'))            return '🌐';
    return '📄';
}
function fileSize(b) { return b < 1024 ? b + 'B' : (b / 1024).toFixed(1) + 'KB'; }

function toast(msg, t = 's') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = t === 'e' ? '#b91c1c' : t === 'w' ? '#9a6700' : '#238636';
    el.style.display = 'block';
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);
}
