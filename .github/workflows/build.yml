name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'وش تبني؟'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm install

      - run: eas build --platform android --profile ${{ inputs.build_target }} --non-interactive
