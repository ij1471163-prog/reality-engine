plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naif.realityengine'
    compileSdk 34

    defaultConfig {
        applicationId "com.naif.realityengine"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "AI_KEY", "\"" + (project.hasProperty("AI_KEY") ? project.property("AI_KEY") : (System.getenv("AI_KEY") ?: "")) + "\""
    }

    signingConfigs {
        release {
            storeFile file("../../reality-engine.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: "reality-engine-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
