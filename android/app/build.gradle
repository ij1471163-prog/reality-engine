plugins {
    id 'com.android.application'
}

android {
    namespace 'com.naif.realityengine'
    compileSdk 34

    defaultConfig {
        applicationId "com.naif.realityengine"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "AI_KEY", "\"" + (System.getenv("AI_KEY") ?: "no-key") + "\""
    }

    signingConfigs {
        release {
            storeFile file("../../reality-engine.keystore")
            storePassword System.getenv("KEYSTORE_PASS") ?: { throw new GradleException("KEYSTORE_PASS غير معرّف") }()
            keyAlias System.getenv("KEY_ALIAS") ?: "reality-engine-key"
            keyPassword System.getenv("KEY_PASSWORD") ?: { throw new GradleException("KEY_PASSWORD missing") }()
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }
        release {
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
